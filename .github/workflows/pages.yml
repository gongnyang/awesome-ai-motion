name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Regenerate docs and site from index.json
        run: |
          node scripts/merge.mjs --no-sync
          node scripts/check.mjs --quiet
          node scripts/build-site.mjs
      - name: Assemble Pages artifact
        run: |
          mkdir -p _pages
          cp -r site lib effects recipes index.json index.html .nojekyll _pages/
          find _pages/effects _pages/recipes -name 'README.md' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _pages }
      - id: deployment
        uses: actions/deploy-pages@v4
