</main><script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();

const counter={value:0};
tl.to(counter,{value:62,duration:1.65,ease:'power2.out',onUpdate:()=>{document.querySelector('#value').textContent=Math.round(counter.value);}},.3);

tl.to('.call path',{strokeDashoffset:0,autoRound:false,duration:.65,ease:'none'},3.85);
tl.fromTo('.note,.note-sub',{y:8,opacity:0},{y:0,opacity:1,duration:.35,stagger:.12},4.55);
