<html lang="ko"><head><meta charset="utf-8"><title>스쿼시 앤 스트레치 · Squash &amp; Stretch</title><meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css"><style>

<main class="scene"><div class="lab note">늘어남 → 눌림 → 반발</div><div class="guide"></div><div class="floor"></div><div id="fall"><div class="dot v" id="ball"></div></div><div class="lead" id="volume"><i></i><s></s><span>scaleX × scaleY = 1</span></div></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();
const shape = {s:1};
const deform = () => gsap.set('#ball',{scaleX:1/shape.s,scaleY:shape.s});
tl.to('#fall',{y:340,duration:.85,ease:'power2.in'},.3);
tl.to(shape,{s:1.55,duration:.55,ease:'power2.inOut',onUpdate:deform},.3);
tl.to(shape,{s:.55,duration:.1,ease:'power2.out',onUpdate:deform},1.15);
tl.to('#fall',{y:130,duration:.4,ease:'power2.out'},1.36);
tl.to(shape,{s:1.35,duration:.15,ease:'power2.out',onUpdate:deform},1.36);
tl.to(shape,{s:1,duration:.2,ease:'power2.out',onUpdate:deform},1.51);
tl.to('#fall',{y:340,duration:.37,ease:'power2.in'},1.76);
tl.to(shape,{s:1.35,duration:.37,ease:'power2.in',onUpdate:deform},1.76);
tl.to(shape,{s:.68,duration:.1,ease:'power2.out',onUpdate:deform},2.13);
tl.to(shape,{s:1,duration:.2,ease:'power2.out',onUpdate:deform},2.26);
tl.to('#volume',{opacity:1,duration:.2},2.3);
Motion.ready();
</script></body></html>
