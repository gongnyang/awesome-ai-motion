<script>
const tl = Motion.timeline();
tl.set('.arc', {strokeDasharray:'12 100', svgOrigin:'180 180'}, 0);
tl.to('.arc', {rotation:1080, duration:3, ease:'none'}, 0);
for(let i=0;i<2;i++){
 tl.to('.arc', {strokeDasharray:'72 100', duration:.75, ease:'sine.inOut'}, i*1.5);

}
