<body data-no="613" data-cat="반복·앰비언트 · LOOP &amp; AMBIENT" data-ko="공전 루프" data-en="Orbit Loop" data-meta="반경 160px · 6개 점 · 1회전" data-dur="5" data-poster="2.5">
<main class="scene"><div class="system"><div class="orbit-rule"></div><div class="core">모델</div><div class="orbit"><div class="dot satellite v"></div></div><div class="orbit"><div class="dot satellite "></div></div><div class="orbit"><div class="dot satellite "></div></div><div class="orbit"><div class="dot satellite "></div></div><div class="orbit"><div class="dot satellite "></div></div><div class="orbit"><div class="dot satellite "></div></div></div><div class="copy"><div class="t-xl">하나의 중심<br>여섯 개의 연결</div><p>같은 반경 · 일정한 각속도</p></div></main>

<script>
const tl = Motion.timeline();
document.querySelectorAll('.orbit').forEach((orbit,i)=>{
 tl.fromTo(orbit,{rotation:i*60},{rotation:i*60+360,duration:5,ease:'none'},0);
});
Motion.ready();
</script></body></html>
