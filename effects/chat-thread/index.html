<body data-no="326" data-cat="UI 시연 · UI DEMO" data-ko="대화 말풍선 누적" data-en="Chat Thread" data-meta="메시지 간격 0.9s · 누적 스크롤" data-dur="4.5" data-poster="4.2">
<main class="scene"><div class="kicker lab">02 / 대화</div><div class="headline t-l">답이 쌓이는 순간</div><div class="hint">새 메시지가 이전 대화를 위로 밀어 올린다</div><div class="dot v"></div><div class="caption">질문에서 이해로</div><div class="chat paper"><div class="bar" style="padding:15px 24px;border-bottom:1px solid var(--rule)">대화 기록</div><div class="thread"><div class="bubble"><span class="speaker">질문</span>AI는 어떻게 말을 고를까?</div><div class="bubble reply"><span class="speaker">응답</span>앞의 문장을 먼저 읽어요</div><div class="bubble"><span class="speaker">질문</span>그다음은?</div><div class="bubble reply"><span class="speaker">응답</span>다음 말의 확률을 비교해요</div></div></div></main><script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>

const bubbles=gsap.utils.toArray('.bubble');
bubbles.forEach((el,i)=>{tl.fromTo(el,{opacity:0,scale:.8,y:12},{opacity:1,scale:1,y:0,duration:.25},.3+i*.9);tl.to('.thread',{y:-i*106,duration:.35,ease:'power2.out'},.3+i*.9);});

</script></body></html>
