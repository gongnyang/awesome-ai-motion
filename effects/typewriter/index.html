<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>타자기 · Typewriter</title>
<meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css">
<style>
.label{position:absolute;left:60px;top:175px}.text{position:absolute;left:60px;top:240px;white-space:pre;letter-spacing:0;line-height:1.3}.char{display:inline-block;opacity:0}.caret{display:inline-block;width:4px;height:84px;background:var(--verm);vertical-align:-12px;margin-left:8px}.baseline{position:absolute;left:60px;right:60px;top:355px}.lead{left:60px;top:410px;opacity:0}
</style></head>
<body data-no="093" data-cat="타이포 · TYPOGRAPHY" data-ko="타자기" data-en="Typewriter" data-meta="글자당 0.06s · 커서 0.24s" data-dur="3">
<main class="scene"><div class="lab label">한 글자씩 입력</div><div class="text t-xl" aria-label="AI는 다음 말을 고른다"><span id="letters" aria-hidden="true"></span><span class="caret" id="caret"></span></div><div class="hair baseline"></div><div class="lead" id="note"><i></i><s></s><span>글자 간격 0.06s</span></div></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
const text = Array.from('AI는 다음 말을 고른다');
const host = document.querySelector('#letters');
text.forEach(c => { const s = document.createElement('span'); s.className = 'char'; s.textContent = c; host.appendChild(s); });
const chars = [...host.children];
// 폰트가 준비된 뒤 하네스가 seek한다. 인라인 커서는 숨긴 글자의 폭만큼 역이동한다.
const state = {time:0};
let widths = chars.map(c => c.offsetWidth);
document.fonts.ready.then(() => { widths = chars.map(c => c.offsetWidth); paint(); });
function paint() {
 const n = Math.min(chars.length, Math.max(0, Math.floor((state.time - .3 + 1e-7) / .06) + 1));
 chars.forEach((c,i) => c.style.opacity = i < n ? 1 : 0);
 const remaining = widths.slice(n).reduce((w,v) => w + v, 0);
 gsap.set('#caret', {x:-remaining, opacity:state.time >= 2.4 ? 1 : (Math.floor(state.time / .24) % 2 ? 0 : 1)});
}
tl.to(state, {time:3, duration:3, ease:'none', onUpdate:paint}, 0);
tl.to('#note', {opacity:1, duration:.25}, 1.35);
paint();
Motion.ready();
</script></body></html>
