<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();
const s={p:0},before=[62,21,17],after=[75,15,10],names=['고른다','정한다','기타'];function point(a,r){return [380+Math.cos(a)*r,330+Math.sin(a)*r];}function arc(a,b){const o=point(a,190),q=point(b,190),u=point(b,117),v=point(a,117),large=b-a>Math.PI?1:0;return `M${o} A190,190 0 ${large} 1 ${q} L${u} A117,117 0 ${large} 0 ${v} Z`;}function draw(){let a=-Math.PI/2;const values=before.map((v,i)=>v+(after[i]-v)*s.p);values.forEach((v,i)=>{const b=a+v/100*Math.PI*2;document.querySelector('#slice'+i).setAttribute('d',arc(a,b));document.querySelector('#legend'+i).textContent=names[i]+' '+Math.round(v)+'%';a=b;});document.querySelector('#share').textContent=Math.round(values[0])+'%';}draw();tl.to(s,{p:1,duration:1.1,ease:'power2.inOut',onUpdate:draw},1);
