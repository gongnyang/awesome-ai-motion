<main class="scene"><div class="kicker lab">07 / 상태</div><div class="headline t-l">현재 상태는 하나</div><div class="hint">연결선을 따라 이동한 신호가 다음 상태를 켠다</div><svg class="diagram" viewBox="0 0 1088 340"><path class="edge" d="M200 170H900"/><g class="node n0"><circle cx="180" cy="170" r="57"/><text x="180" y="178">대기</text></g><g class="node n1"><circle cx="540" cy="170" r="57"/><text x="540" y="178">처리</text></g><g class="node n2"><circle cx="900" cy="170" r="57"/><text x="900" y="178">완료</text></g><circle class="signal" cx="237" cy="170" r="9"/></svg><div class="current"><span class="s0">입력을 기다린다</span><span class="s1 state-label">모델이 확률을 계산한다</span><span class="s2 state-label">다음 말이 결정된다</span></div></main><script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
