<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>커버플로우 · Coverflow</title>
<meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css">
<style>.space{position:absolute;inset:0;perspective:900px}.card{position:absolute;left:434px;top:90px;width:300px;height:370px;background:var(--paper2);border:1px solid var(--ink);padding:25px;backface-visibility:hidden}.card .num{font-size:150px;margin-top:42px}.card .t-m{position:absolute;left:25px;bottom:30px}.mark{position:absolute;right:25px;top:25px;width:18px;height:18px}.hint{position:absolute;bottom:30px;left:0;right:0;text-align:center}</style></head>
<body data-no="560" data-cat="3D·깊이 · 3D &amp; DEPTH" data-ko="커버플로우" data-en="Coverflow" data-meta="목록 탐색 · 중앙 정면 · 측면 45도" data-dur="4.5" data-poster="4">
<main class="scene"><div class="space"><section class="card"><span class="lab">단계 01</span><div class="num">01</div><div class="t-m">입력</div></section><section class="card"><span class="lab">단계 02</span><div class="num">02</div><div class="t-m">문맥</div></section><section class="card"><span class="lab">단계 03</span><div class="num">03</div><div class="t-m">후보</div></section><section class="card"><span class="lab">단계 04</span><div class="num">04</div><div class="t-m">다음 말</div><div class="dot v mark"></div></section><section class="card"><span class="lab">단계 05</span><div class="num">05</div><div class="t-m">출력</div></section></div><div class="lab hint">중앙의 정보에 초점을 맞춘다</div></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>const tl = Motion.timeline();
const cards=[...document.querySelectorAll('.card')];
function pose(d){return {x:d*285,z:-Math.abs(d)*155,rotationY:-Math.sign(d)*45,scale:1-Math.min(.3,Math.abs(d)*.1),zIndex:10-Math.abs(d)};}
cards.forEach((c,i)=>tl.set(c,pose(i-1),0));
[2,3].forEach((focus,k)=>cards.forEach((c,i)=>tl.to(c,{...pose(i-focus),duration:.6,ease:'power2.inOut'},.8+k*1.25)));
Motion.ready();</script></body></html>
