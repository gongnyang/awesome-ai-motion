<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>로딩 도트 · Loading Dots</title>
<meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css">
<style>.hint{position:absolute;left:80px;bottom:40px;font-size:15px;color:var(--ink2)}.heading{position:absolute;left:80px;top:50px;font-size:18px;color:var(--ink2)}.hero{position:absolute;left:80px;top:125px;width:1008px;height:300px}.hero .t-xl{position:absolute;left:0;top:40px}.hero .num{position:absolute;right:0;top:25px;font-size:240px}.hero .dot{position:absolute;left:515px;top:142px}.hero .hair{position:absolute;left:0;right:0;bottom:0}.hero .lab{position:absolute;left:0;bottom:20px}
.message{position:absolute;left:190px;top:130px;width:790px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:50px 0 70px}.message .t-xl{font-size:72px}.dots{display:flex;gap:20px;margin-top:40px}.dots .dot{width:34px;height:34px}.message .lab{position:absolute;right:0;bottom:40px}</style></head>
<body data-no="585" data-cat="반복·앰비언트 · LOOP &amp; AMBIENT" data-ko="로딩 도트" data-en="Loading Dots" data-meta="3개 점 · 주기 1.2s" data-dur="3.6" data-poster="1.65">
<main class="scene"><span class="heading">응답을 기다리는 시간</span><div class="message"><div class="t-xl">다음 말을 고르는 중</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot v"></div></div><span class="lab">잠시만 기다려 주세요</span></div></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
for(let cycle=0;cycle<3;cycle++){
 document.querySelectorAll('.dots .dot').forEach((dot,i)=>{
  const at=cycle*1.2+i*.15;
  tl.to(dot, {y:-8,scale:1.18,duration:.45,ease:'sine.inOut'}, at);
  tl.to(dot, {y:0,scale:1,duration:.45,ease:'sine.inOut'}, at+.45);
 });
}
Motion.ready();
</script></body></html>
