<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스크램블 · Text Scramble</title><meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css">
<style>
.label{position:absolute;left:60px;top:175px}.text{position:absolute;left:60px;top:240px;white-space:pre;letter-spacing:0;line-height:1.3}.slot{position:relative;display:inline-block}.measure{opacity:0}.char{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.baseline{position:absolute;left:60px;right:60px;top:355px}.lead{left:60px;top:410px;opacity:0}
</style></head><body data-no="092" data-cat="타이포 · TYPOGRAPHY" data-ko="스크램블" data-en="Text Scramble" data-meta="seed 603 · 갱신 0.05s · 고정 +0.085s" data-dur="3">
<main class="scene"><div class="lab label">기호 순환 · 왼쪽부터 고정</div><div class="text t-xl" id="text" aria-label="AI는 다음 말을 고른다"></div><div class="hair baseline"></div><div class="lead" id="note"><i></i><s></s><span>글자 고정 +0.085s</span></div></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();
const text = Array.from('AI는 다음 말을 고른다');
const symbols = Array.from('!?%#+=<>*:/');
const random = Motion.rand(603);
const table = Array.from({length:61}, () => text.map(c => c === ' ' ? ' ' : symbols[Math.floor(random()*symbols.length)]));
const chars = text.map(c => {
 const slot = document.createElement('span'); slot.className = 'slot'; slot.setAttribute('aria-hidden','true');
 const measure = document.createElement('span'); measure.className = 'measure'; measure.textContent = c;
 const glyph = document.createElement('span'); glyph.className = 'char';
 slot.append(measure,glyph); document.querySelector('#text').appendChild(slot); return glyph;
});
const state = {time:0};
function paint() {
 const tick = Math.min(60, Math.max(0, Math.floor((state.time-.3)/.05)));
 const pending = text.findIndex((c,i) => c !== ' ' && state.time < .7+i*.085);
 chars.forEach((c,i) => {
  const locked = state.time >= .7+i*.085;
  c.textContent = locked ? text[i] : table[tick][i];
  c.style.color = locked ? 'var(--ink)' : i === pending ? 'var(--verm)' : 'var(--ink3)';
 });
}
tl.to(state, {time:3, duration:3, ease:'none', onUpdate:paint}, 0);
tl.to('#note', {opacity:1, duration:.25}, 1.95);
paint();
Motion.ready();
</script></body></html>
