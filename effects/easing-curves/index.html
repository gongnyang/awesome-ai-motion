<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이징 · Easing</title><meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.row{position:absolute;left:50px;right:50px;height:100px}.a{top:100px}.b{top:260px}.c{top:420px}
.name{position:absolute;left:0;top:40px}.track{position:absolute;left:170px;top:50px;width:670px;height:1px;background:var(--rule)}
.dot{position:absolute;left:146px;top:26px;width:48px;height:48px}.a .dot,.b .dot{background:var(--ink3)}
.end{position:absolute;left:840px;top:26px;height:48px;border-left:1px solid var(--rule)}
.graph{position:absolute;left:925px;top:0;width:120px;height:100px;opacity:0}.graph path{fill:none;stroke:var(--ink);stroke-width:2}.graph .axis{stroke:var(--rule);stroke-width:1}
.note{position:absolute;left:50px;top:36px}.arrived{position:absolute;left:760px;top:36px;opacity:0}
</style></head>
<body data-no="003" data-cat="기본기 · PRINCIPLES" data-ko="이징" data-en="Easing" data-meta="670px · 1.50s · 세 가지 속도 곡선" data-dur="3">
<main class="scene"><div class="lab note">같은 거리 · 같은 시간</div><div class="lab arrived">동시 도착 · 1.80s</div>
<div class="row a"><span class="lab name">linear</span><div class="track"></div><div class="end"></div><div class="dot" id="linear"></div><svg class="graph" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path d="M10 90L110 10"/></svg></div>
<div class="row b"><span class="lab name">power3.in</span><div class="track"></div><div class="end"></div><div class="dot" id="in"></div><svg class="graph" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path id="inGraph"/></svg></div>
<div class="row c"><span class="lab name">power3.out</span><div class="track"></div><div class="end"></div><div class="dot v" id="out"></div><svg class="graph" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path id="outGraph"/></svg></div>
</main><script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();
['in','out'].forEach(type => { const ease = gsap.parseEase('power3.'+type); document.querySelector('#'+type+'Graph').setAttribute('d',Array.from({length:41},(_,i)=>`${i?'L':'M'}${10+i*2.5} ${90-80*ease(i/40)}`).join(' ')); });
[['#linear','none'],['#in','power3.in'],['#out','power3.out']].forEach(([s,ease]) => tl.to(s,{x:670,duration:1.5,ease},.3));
tl.to('.graph,.arrived',{opacity:1,duration:.25},1.9);
Motion.ready();
</script></body></html>
