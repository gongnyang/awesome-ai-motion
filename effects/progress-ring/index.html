<html lang="ko"><head><meta charset="utf-8"><title>원형 진행 게이지</title><meta name="viewport" content="width=1280"><link rel="stylesheet" href="../../lib/stage.css"><style>svg{position:absolute;inset:0;width:1168px;height:580px}svg text{font-family:var(--sans);font-size:22px;fill:var(--ink)}svg .small{font-size:16px;fill:var(--ink2)}svg .big{font-family:var(--didone);font-size:76px}svg .grid{stroke:var(--rule);stroke-width:1}svg .axis{stroke:var(--ink);stroke-width:1} .heading{position:absolute;left:32px;top:26px;font-size:30px}.sub{position:absolute;left:34px;top:72px;font-size:16px;color:var(--ink2)}</style></head>
<body data-no="285" data-cat="데이터 · DATA" data-ko="원형 진행 게이지" data-en="Progress Ring" data-meta="예시 데이터 · 3.5초" data-dur="3.5" data-poster="3.2">
<main class="scene"><div class="heading t-m">배운 만큼 채워진다</div><div class="sub">원형 진행률과 숫자가 같은 값에 도착한다</div><svg viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg"><circle cx="370" cy="330" r="172" fill="none" stroke="var(--rule)" stroke-width="22"/><circle id="ring" cx="370" cy="330" r="172" fill="none" stroke="var(--verm)" stroke-width="22" transform="rotate(-90 370 330)"/><text id="pct" class="big" x="370" y="353" text-anchor="middle">0%</text><text class="small" x="370" y="390" text-anchor="middle">학습 완료율</text><text x="670" y="287">전체 100개 중</text><text id="count" class="big" x="670" y="373">0개</text><text class="small" x="674" y="425">기초 과정 · 예시 진행률</text></svg></main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script><script>
const tl = Motion.timeline();
const s={p:0},C=2*Math.PI*172;function draw(){const n=Math.round(s.p*100);const r=document.querySelector('#ring');r.style.strokeDasharray=C;r.style.strokeDashoffset=C*(1-s.p);document.querySelector('#pct').textContent=n+'%';document.querySelector('#count').textContent=n+'개';}draw();tl.to(s,{p:.75,duration:1.4,ease:'power2.out',onUpdate:draw},.45);
