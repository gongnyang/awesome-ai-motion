<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>대형 키네틱 타이포 스윕 · Kinetic Type Sweep</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.row{position:absolute;left:0;height:193px;line-height:193px;white-space:nowrap;will-change:transform}
.r1{top:-11px;font-family:var(--serif);font-weight:700;font-size:200px;letter-spacing:-.04em;color:var(--ink)}
.r2{top:193px;font-family:var(--serif);font-weight:700;font-size:200px;letter-spacing:-.04em;color:var(--ink)}
.r3{top:404px;font-family:var(--didone);font-weight:600;font-size:210px;font-variation-settings:"opsz" 96;font-feature-settings:"lnum" 1;color:transparent;-webkit-text-stroke:2px var(--ink)}
.r2 span{display:inline-block}
#hit{transform-origin:50% 60%}
.band{position:absolute;left:0;width:1280px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:50% 50%}
.lead{opacity:0}
</style></head>
<body data-no="096" data-cat="타이포 · TYPOGRAPHY" data-ko="대형 키네틱 타이포 스윕" data-en="Kinetic Type Sweep" data-meta="3줄 역방향 · 속도비 1 : 1.6 : 0.5 · power4.out 정지" data-dur="3.5" data-poster="3.2">
<main class="scene bleed">
  <div class="row r1" id="R1">AI는 다음 말을 고른다 · AI는 다음 말을 고른다 · AI는 다음 말을 고른다 ·</div>
  <div class="row r2" id="R2"><span class="rest">고른다 · 정한다 · 찾는다 ·&nbsp;</span><span id="hit">다음 말</span><span class="rest">&nbsp;· 만든다 · 쓴다 · 고른다 · 정한다</span></div>
  <div class="row r3" id="R3">939 · 62% · 21% · 9% · 5% · 3% · 939</div>
  <div class="band" style="top:198px"></div><div class="band" style="top:401px"></div>
  <div class="lead" id="note" style="left:975px;top:318px"><i></i><s></s><span>0.30s 만에 정지</span></div>
</main>
<script src="../../lib/gsap.min.js"></script>
<script src="../../lib/stage.js"></script>
<script>
document.fonts.load('600 210px "Bodoni Moda"').then(() => document.fonts.ready).then(() => {
  const tl = Motion.timeline();
  // 1줄: 왼쪽으로 빠르게, 3줄: 왼쪽으로 느리게 (둘 다 서서히 감속)
  tl.fromTo('#R1', {x: 1300}, {x: -1500, duration: 2.6, ease: 'power2.out'}, 0.1);
  tl.fromTo('#R3', {x: 1300}, {x: -60, duration: 2.6, ease: 'power2.out'}, 0.1);
  // 2줄: 오른쪽으로 거의 등속 질주 → 마지막 0.3초에 power4.out으로 급정지, 핵심어가 정중앙
  const r2 = document.getElementById('R2'), hit = document.getElementById('hit');
  const xEnd = 640 - (hit.offsetLeft + hit.offsetWidth / 2);
  const xStart = -r2.offsetWidth - 40;
  const L = xEnd - xStart, s = L * 0.0370; // 등속 구간 끝 속도와 급정지 첫 속도를 맞춤
  tl.fromTo('#R2', {x: xStart}, {x: xEnd - s, duration: 1.95, ease: 'none'}, 0.15);
  tl.to('#R2', {x: xEnd, duration: 0.3, ease: 'power4.out'}, 2.1);
  // 정지 순간: 핵심어만 주홍, 나머지는 옅어진다
  tl.to('#hit', {color: 'var(--verm)', duration: 0.12}, 2.12);
  tl.fromTo('#hit', {scale: 1.07}, {scale: 1, duration: 0.35, ease: 'power3.out'}, 2.12);
  tl.to('#R2 .rest', {opacity: 0, duration: 0.35}, 2.2);
  tl.to('#R1, #R3', {opacity: 0.13, duration: 0.5}, 2.15);
  tl.to('.band', {scaleX: 1, duration: 0.45, ease: 'power3.out'}, 2.2);
  tl.to('#note', {opacity: 1, duration: 0.2}, 2.6);
  Motion.ready();
});
</script>
</body></html>
