<script>const tl = Motion.timeline();

for(let i=0;i<5;i++){
  tl.set('#card'+i,{z:-i*65,y:-i*22,rotationX:-i*5},0);
}

  const start=.38+i*.18;
  tl.to('#card'+i,{rotationX:-115,y:-145,z:90,duration:.65,ease:'power2.inOut'},start);

}
tl.fromTo('#card4',{rotationX:-42},{rotationX:0,y:0,z:0,duration:1.1,ease:'power3.out'},1.1);
tl.to('.stack',{x:0,rotationY:-5,duration:1.4,ease:'sine.inOut'},.3);
tl.to('.stack',{rotationY:0,duration:.65,ease:'sine.inOut'},2.4);
tl.to('.note',{opacity:1,duration:.2},3.1);

Motion.ready();</script></body></html>
